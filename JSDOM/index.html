<!DOCTYPE html>

<body>
    <input type="radio" name="gender" value="male" onchange="changender()"> Male 
    <input type="radio" name="gender" value="female"> Female
    <script>
        function changender() {
            //เลือก gender ทั้งหมด
            let genders = document.querySelectorAll('input[name="gender"]');

            //ดูว่าอันไหนมัน check
            for(let i=0; i < genders.length; i++) {
                if(genders[i].checked) {
                    console.log("Gender selected: " + genders[i].value);
                }
            }
        }
    </script>

</body>

<body>

    <input type="checkbox" name="fname" value="ว่ายน้ำ" checked> ว่ายน้ำ
    <script>
        let inputs = document.querySelectorAll('input[type="checkbox"]');
        console.log(inputs);
        for(let i=0; i < inputs.length; i++) {
            console.log(inputs[i].value);
        }
    </script>
